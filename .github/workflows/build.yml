name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed; this installs a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      # The fixed signing key lives only in GitHub secrets. Same key every build,
      # so a new APK installs over the old one.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CCTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret CCTV_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cctv.jks"

      - name: Build
        working-directory: android
        env:
          CCTV_KEYSTORE_PATH: ${{ runner.temp }}/cctv.jks
          CCTV_KEYSTORE_PASSWORD: ${{ secrets.CCTV_KEYSTORE_PASSWORD }}
          CCTV_KEY_PASSWORD: ${{ secrets.CCTV_KEYSTORE_PASSWORD }}
          CCTV_KEY_ALIAS: cctv
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk cctv.apk

      - uses: actions/upload-artifact@v5
        with:
          name: cctv-apk
          path: cctv.apk
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cctv.jks"
